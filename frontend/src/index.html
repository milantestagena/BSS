<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tripinele</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">

  <!--
    SEO / social-preview meta added 2026-09-04 (launch day, ahead of FB/IG ad setup).
    IMPORTANT: this is a pure client-side SPA (no SSR/prerendering — see angular.json, no
    @angular/ssr, no server.ts). One static index.html is served for every route (/, /latesummer,
    /privacy, /account), so these tags are necessarily the same regardless of which URL a
    crawler/bot actually requests — there is no per-route variant without adding SSR. Copy/tone
    pulled from the live "kasno-letovanje" campaign intro (frontend/src/app/app.routes.ts).
    og:url/canonical point at /latesummer specifically since that's the actual live campaign page
    the FB/IG ads will link to, not the bare "/" redirect shell.
  -->
  <meta name="description" content="It's still beach weather on the Mediterranean — don't miss it. Answer a few quick questions and get a personalized, honest beach holiday match.">
  <link rel="canonical" href="https://tripinele.com/latesummer">

  <!-- Open Graph (Facebook/Instagram link previews read these directly) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tripinele">
  <meta property="og:title" content="Haven't been to the sea lately?">
  <meta property="og:description" content="It's still beach weather on the Mediterranean. Don't miss it! Get a personalized, honest beach holiday match in a few clicks.">
  <meta property="og:url" content="https://tripinele.com/latesummer">
  <meta property="og:image" content="https://tripinele.com/images/Gemini_Generated_Image_ybbh9dybbh9dybbh.png">
  <meta property="og:image:width" content="1392">
  <meta property="og:image:height" content="752">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="de_DE">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Haven't been to the sea lately?">
  <meta name="twitter:description" content="It's still beach weather on the Mediterranean. Don't miss it!">
  <meta name="twitter:image" content="https://tripinele.com/images/Gemini_Generated_Image_ybbh9dybbh9dybbh.png">

  <!-- Meta Pixel moved out of here 2026-09-05 — a GDPR cookie-consent banner is now required
       (this site targets EU/DACH users) and Pixel loading must be gated on real consent, not
       fire unconditionally on every page load like a static snippet does. See
       AnalyticsService/CookieConsentComponent, which load the Pixel script only after the
       visitor accepts. -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
