<div class="mb-6 space-y-6">
  <div>
    <label class="mb-2 block text-sm font-semibold text-white">{{ adultsLabel() }}</label>
    <ui-number-stepper [value]="adultsCount() ?? 1" [min]="1" (valueChange)="onAdultsChange($event)" />
  </div>

  <div>
    <label class="mb-2 block text-sm font-semibold text-white">{{ childrenSectionLabel }}</label>

    <div class="space-y-2">
      @for (age of childrenAges(); track $index) {
        <div class="flex items-center gap-3">
          <span class="text-sm text-stone-200">{{ i18n.t('age') }}</span>
          <ui-number-stepper [value]="age" [min]="0" [max]="17" (valueChange)="onChildAgeStepperChange($index, $event)" />

          @if (age <= 2) {
            <label class="inline-flex items-center gap-1.5 text-sm text-white">
              <input
                type="checkbox"
                class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-400"
                [checked]="needsCrib()[$index]"
                (change)="onCribToggle($index, $any($event.target).checked)"
              />
              {{ i18n.t('needCrib') }}
            </label>
          }

          <button
            type="button"
            class="ml-auto text-sm text-stone-200 hover:text-red-300"
            (click)="removeChild($index)"
          >
            {{ i18n.t('remove') }}
          </button>
        </div>
      }
    </div>

    <button
      type="button"
      class="mt-3 text-sm font-medium text-white hover:text-stone-200"
      (click)="addChild()"
    >
      {{ i18n.t('addChild') }}
    </button>
  </div>
</div>
