<app-account-badge></app-account-badge>
<!-- Reserves space for the fixed header bar above (see AccountBadgeComponent docblock, bug
     fixed 2026-08-14) so no page's content ever starts underneath it.

     h-dvh (not h-screen), 2026-09-05 (owner caught it live on a real phone: the footer's link
     row was cut off below the fold) — `100vh`/h-screen measures the LARGEST possible viewport,
     including the space mobile browsers' address bar temporarily occupies before it
     auto-hides, so a layout pinned to exactly `100vh` extends below what's actually visible on
     first load. `100dvh` (dynamic viewport height) tracks the real, current visible area
     instead — the whole reason h-screen + overflow-y-auto on the router-outlet wrapper exists
     (owner's call, "stavi skroler na nivo chata... bolje za mobilni, da ne skakuce") only
     actually holds with the viewport unit that matches reality. Footer and the cookie-consent
     banner are plain static siblings below the scrolling region — they're always the last thing
     in this fixed-height column, so they're always fully visible without any risk of a `fixed`
     element covering page content. -->
<div class="flex h-dvh flex-col pt-14">
  <div #scrollContainer class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </div>
  <app-footer></app-footer>
  <app-cookie-consent></app-cookie-consent>
</div>
