"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"A date string with format `Y-m-d`, e.g. `2018-05-23`."
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

"Arbitrary JSON value (object/array/scalar), used for taxonomy `meta` and session `free_text_answers`."
scalar JSON @scalar(class: "MLL\\GraphQLScalars\\MixedScalar")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    "Active wizard steps in order, each with its questions."
    wizardSteps: [WizardStep!]! @all(scopes: ["active"])

    "A single search session by id."
    searchSession(id: ID @eq): SearchSession @find

    "Suggested taxonomy nodes of any type, filtered by the session's implies/excludes relations and ranked by preference-tag overlap. parentId narrows to a single parent (country->city); parentIds narrows to ANY of several (multi-selected countries) — 2026-08-12, see GeographyResolver::suggested. Both empty means unfiltered (every country selected)."
    suggestedGeography(
        sessionId: ID!
        type: String!
        parentId: ID
        parentIds: [ID!]
    ): [TaxonomyNode!]! @field(resolver: "App\\GraphQL\\Resolvers\\GeographyResolver@suggested")

    "Compiles a session (which should already have a destination city chosen) into real Booking.com request parameters plus Honest Report signals for the AI layer. Shape: { bookingParams: JSON, honestReportSignals: JSON, bookingUrl: String|null, bookingFlightsUrl: String|null } — kept as JSON since both shapes are still evolving; see wizard_architecture memory. bookingUrl/bookingFlightsUrl are real public booking.com links (accommodation search / flights search), null until a destination + dates are resolvable — see SearchSessionQueryCompiler."
    compiledSearchQuery(sessionId: ID!): JSON!
        @field(resolver: "App\\GraphQL\\Resolvers\\SearchSessionQueryResolver@compiled")

    "Static, campaign-scoped deep-dive guide content for one destination — see DestinationGuide model. Keyed by sessionId (not a separate campaignId arg) so the resolver can derive campaign context the same way suggestedGeography/compiledSearchQuery already do. Null if the session has no campaign, or no guide row exists yet for this node."
    destinationGuide(sessionId: ID!, taxonomyNodeId: ID!): DestinationGuide
        @field(resolver: "App\\GraphQL\\Resolvers\\DestinationGuideResolver@show")

    "A themed wizard campaign by key (e.g. 'kasno-letovanje'), with its questions in campaign order."
    wizardCampaign(key: String! @eq): WizardCampaign @find

    "Typeahead search over the GeoNames world-cities catalog (population > 15000), for the home_city question. Requires 3+ characters, capped at 10 results ranked by population."
    homeCitySearch(query: String!): [WorldCity!]!
        @field(resolver: "App\\GraphQL\\Resolvers\\WorldCityResolver@search")

    "The currently logged-in user (via the Google OAuth session cookie), or null if anonymous. See CLAUDE.md section 5/8."
    me: User @auth
}

"Indicates what fields are available at the top level of a mutation operation."
type Mutation {
    "Start a new, empty search session. No login required."
    startSearchSession: SearchSession! @field(resolver: "App\\GraphQL\\Resolvers\\SearchSessionResolver@start")

    "Start a new session under a themed campaign — applies the campaign's preset answers immediately, so dependent questions/excludes are already active from the first read."
    startCampaignSession(campaignKey: String!): SearchSession!
        @field(resolver: "App\\GraphQL\\Resolvers\\SearchSessionResolver@startCampaign")

    "Write answers collected so far onto a search session."
    updateSearchSession(id: ID!, input: UpdateSearchSessionInput!): SearchSession!
        @field(resolver: "App\\GraphQL\\Resolvers\\SearchSessionResolver@update")

    "Find-or-create the taxonomy_node a homeCitySearch result corresponds to, so home_city_id keeps pointing at a real taxonomy node (reuses the existing distance-calculation machinery). Call this first, then pass the returned node's id as homeCityId in updateSearchSession."
    selectWorldCityAsHomeCity(worldCityId: ID!): TaxonomyNode!
        @field(resolver: "App\\GraphQL\\Resolvers\\WorldCityResolver@selectAsHomeCity")

    "Auto-detects home_city from the visitor's request IP (see IpGeolocationClient) instead of asking — null if it can't be geolocated (private/local IP, lookup failure), which the frontend treats the same as 'never answered'."
    detectHomeCity: TaxonomyNode
        @field(resolver: "App\\GraphQL\\Resolvers\\WorldCityResolver@detectHomeCity")

    """
    AI-generated "Honest Report" (pros/cons) for one listing, grounded in the session's
    compiled honestReportSignals plus the given listing's own description/reviews text — see
    HonestReportGenerator. The listing itself isn't a backend concept; the caller (today, the
    frontend's mock hotel cards) supplies whatever description/reviews text it has, real or
    mock, and this resolver never needs to know which. English only for now — no per-locale
    translation yet, since reports are per-session/per-listing, not stable reusable content
    like taxonomy labels (see HonestReportGenerator's docblock).
    """
    generateHonestReport(sessionId: ID!, listingName: String!, listingDescription: String!, reviews: [String!]): HonestReport!
        @field(resolver: "App\\GraphQL\\Resolvers\\HonestReportResolver@generate")
        @aiCredits

    "Raw funnel/usage log entry — owner's ask, 2026-08-13, see WizardEvent model. Fire-and-forget from the frontend (step_viewed today); never blocks or errors the wizard flow if it fails."
    recordWizardEvent(sessionId: ID!, eventType: String!, payload: JSON): Boolean!
        @field(resolver: "App\\GraphQL\\Resolvers\\WizardEventResolver@record")

    """
    Owner's ask, 2026-08-24: matches the session's free-text smestaj_preference against the same
    real Booking filter catalog the amenity picker uses (tip_smestaja/accommodation_facility/
    room_facility/meal_plan/stay_type), merging any matches into amenities_yes so they route
    through the exact real Booking filters a manual pick would (see
    SearchSessionQueryCompiler::applyAmenityYesFilters). No-op, returns amenities_yes unchanged,
    if smestaj_preference is empty or nothing matches. Returns the full, updated amenities_yes
    list. Deliberately NOT @aiCredits — free-text entries never cost extra credits (CLAUDE.md
    section 3), and this only ever fires from a free-text answer already typed for free.
    """
    extractFreeTextAmenities(sessionId: ID!): [String!]!
        @field(resolver: "App\\GraphQL\\Resolvers\\FreeTextAmenityResolver@extract")
}

"A node in the self-referencing taxonomy tree (trip types, group types, personas, geography, ...)."
type TaxonomyNode {
    id: ID!
    parent: TaxonomyNode @belongsTo
    children: [TaxonomyNode!]! @hasMany
    type: String!
    slug: String!
    label: String! @translate
    sortOrder: Int! @rename(attribute: "sort_order")
    meta: JSON
    "Populated only when returned from `suggestedGeography` — higher is a better match."
    matchScore: Int @rename(attribute: "match_score")
    "Populated only when returned from `suggestedGeography` for type=country/city: true if this destination only appears because nothing fit the stated budget and it's one of the 2 closest fallbacks — show an 'more expensive than asked, but nearest fit' note."
    budgetCaveat: Boolean @rename(attribute: "budget_caveat")
    "Populated only when returned from `suggestedGeography` for type=country/city, when budget data exists: 'eating_out' | 'self_catering' | a specific meal_plan_preference slug (e.g. 'sve_ukljuceno', 'dorucak') | null — which spending style/tier this destination's price actually fit under, see BudgetEstimationEngine::fitFor. Frontend turns this (plus budgetCaveat/budgetFitPercent) into a short reason, e.g. 'fits if you cook for yourself'."
    budgetFit: String @rename(attribute: "budget_fit")
    "Populated only when returned from `suggestedGeography` for type=country/city, when budget data exists — true if an all-inclusive meal plan would ALSO fit this destination for the session's budget, regardless of the session's actual meal_style (see BudgetEstimationEngine::allInclusiveFits). Purely informational, e.g. 'all-inclusive available here too' — never affects budgetFit/inclusion/sorting."
    allInclusiveFits: Boolean @rename(attribute: "all_inclusive_fits")
    "Populated only when returned from `suggestedGeography` for type=country/city — true if this destination matched EVERY selected vibe preference_tag (not just some). For type=country, also requires at least one child city to independently match all of them too, so a country never shows this without a real bookable city to back it up (see GeographyResolver::isPerfectMatch)."
    perfectMatch: Boolean @rename(attribute: "perfect_match")
    "Populated only when returned from `suggestedGeography` — true if forced on by an `implies` relation from an already-selected answer (e.g. Foodie -> Great food). Shown selected-and-locked in the UI rather than hidden, so the reason is visible instead of the option silently vanishing."
    implied: Boolean
    "Populated only when returned from `suggestedGeography` for type=country/city — preference_tag slugs this node matched against the session's selected preferences. Frontend groups results by shared matched_tags rather than showing a flat ranked list."
    matchedTags: [String!] @rename(attribute: "matched_tags")
    "Populated only when returned from `suggestedGeography` for type=country/city, when total_budget AND real accommodation+food totals both exist: (accommodation + food) / total_budget * 100, rounded to 1 decimal. Absolute, not relative to the other candidates shown — replaces the old priceRank (2026-09-01), which was a pure relative accommodation-only ranking that never compared against the traveler's stated budget at all. Bucket for display: <70 green, 70-100 yellow, >100 red."
    budgetFitPercent: Float @rename(attribute: "budget_fit_percent")
    "Populated only when returned from `suggestedGeography` for type=country/city, campaign mode only — true if a DestinationGuide row exists for this node + the session's campaign. Frontend uses this to decide whether to even show the optional 'see full guide' link at all."
    hasGuide: Boolean @rename(attribute: "has_guide")
    "Populated only when returned from `suggestedGeography` — slugs of taxonomy_node_relations this node EXCLUDES (relation_type=excludes), e.g. preference_tag 'jeftino' excludes 'kvalitet'. Frontend live-deselects any of these from the same multi-choice question when this node is picked, not just filters what a later question offers."
    excludesSlugs: [String!] @rename(attribute: "excludes_slugs")
    "Populated only when returned from `suggestedGeography` for type=country/city, when meal_plan_preference is answered — true if this destination doesn't really offer any of the requested meal plans (see TaxonomyNode::offersMealPlan / GeographyResolver::mealPlanFitFor). Never excludes the destination, only downranks it — show a 'doesn't offer exactly what you asked for meals' note."
    mealPlanCaveat: Boolean @rename(attribute: "meal_plan_caveat")
    "Populated only when returned from `suggestedGeography` for type=country/city, when the session has resolvable trip dates and real Open-Meteo climate data exists for at least one of the months the trip spans — see GeographyResolver::climateSummaryFor. Real imported data, not estimated. Null if no data exists for any spanned month."
    climateAirTempC: TemperatureRange @rename(attribute: "climate_air_temp_c")
    "Same as climateAirTempC, sea surface temperature instead of air."
    climateSeaTempC: TemperatureRange @rename(attribute: "climate_sea_temp_c")
    "meta.vibe_profile.description, translated — real dedicated field + @translate (2026-09-03) so the 'See more' popover text finally honors X-Locale like every other label does; reading it out of the raw `meta` JSON blob (the old client-side path) could never be locale-aware since @translate only ever sees one resolved scalar field, not a path inside JSON. Null if this node has no vibe_profile description."
    vibeDescription: String @method @translate(attribute: "vibe_profile_description")
}

"A min/max range for a real Open-Meteo temperature reading across the calendar months a trip spans (see GeographyResolver::monthsSpanned) — min === max for a single-month trip, not a range."
type TemperatureRange {
    min: Float!
    max: Float!
}

"One page of the wizard, admin-orderable and toggleable."
type WizardStep {
    id: ID!
    key: String!
    label: String! @translate
    sortOrder: Int! @rename(attribute: "sort_order")
    isActive: Boolean! @rename(attribute: "is_active")
    questions: [WizardQuestion!]! @hasMany
}

"A themed wizard entry point (e.g. 'Kasno letovanje') — its own question subset/order over the same global wizard_questions, plus preset answers applied at session start. See wizard_architecture memory, 2026-07-29/30."
type WizardCampaign {
    id: ID!
    key: String!
    label: String! @translate
    landingHeadline: String @rename(attribute: "landing_headline") @translate(attribute: "landing_headline")
    "Values written directly onto the session at start — e.g. {termin_category: 'kasno_kupanje'}. Fields covered here are never asked as a question for this campaign."
    presetAnswers: JSON @rename(attribute: "preset_answers")
    "This campaign's questions, in campaign-specific order (independent of each question's global sort_order)."
    questions: [WizardQuestion!]! @belongsToMany
    "Admin-editable per-campaign tunables — see WizardSeeder's kasno-letovanje entry. Not hardcoded in frontend/backend logic so a future campaign can set its own values."
    meta: JSON
    "Trip-length day-count implied by this campaign's preset termin_category answer. Populated only when preset_answers includes termin_category and that taxonomy node has default_duration_days meta; null otherwise. Drives the total_budget default on campaigns where termin_category is never a rendered question."
    presetTripLengthDays: Int @method
}

"One stop within a DestinationGuide's country-level itinerary."
type DestinationGuideStop {
    location: String!
    nights: Int!
    highlight: String
}

"One curated photo within a DestinationGuide — Unsplash/Pexels only, see DestinationGuide's docblock for why."
type DestinationGuideImage {
    url: String!
    attribution: String
}

"A country-level accommodation price range, computed live from a country's priced child cities — see DestinationGuide::accommodationPriceRangeEur."
type DestinationGuidePriceRange {
    min: Float!
    max: Float!
}

"Optional 'deep-dive' destination content (itinerary/costs/tips/photos) for one (campaign, destination) pair — see DestinationGuide model's docblock for the full refresh checklist. Static/researched-and-stored, never generated live per request."
type DestinationGuide {
    id: ID!
    campaign: WizardCampaign! @belongsTo
    destination: TaxonomyNode! @belongsTo
    "Country-level only — null for city-level guides (a single resort town has nothing to itinerary-ize). Each stop's `highlight` is locale-aware via a dedicated resolver (2026-09-04) — @translate can't wrap an array field, see DestinationGuide::itinerary()'s docblock."
    itinerary: [DestinationGuideStop!] @method
    "Qualitative only — the real € figure is read live via accommodationPriceEur/accommodationPriceRangeEur below, never stored here."
    accommodationCostNotes: String @rename(attribute: "accommodation_cost_notes") @translate(attribute: "accommodation_cost_notes")
    "2-4 destination-specific tips not already covered by cultural_availability/climate/vibe_profile data (see the model's refresh checklist — those get folded in at write time, not duplicated here). Locale-aware via a dedicated resolver, same reasoning as itinerary above."
    extraTips: [String!] @method
    images: [DestinationGuideImage!]
    researchedAt: Date @rename(attribute: "researched_at")
    source: String
    "City-level real price, read live off wizard_campaign_destination_prices — null for country-level guides."
    accommodationPriceEur: Float @method
    "Country-level real price range across the country's priced child cities — null for city-level guides."
    accommodationPriceRangeEur: DestinationGuidePriceRange @method
    "Per-adult, per-day estimate if eating at restaurants — live off BudgetEstimationEngine. Shown alongside foodCostSelfCateringPerAdultPerDayEur regardless of the session's own meal_style pick."
    foodCostEatingOutPerAdultPerDayEur: Float @method
    "Same per-adult/day estimate, self-catering style."
    foodCostSelfCateringPerAdultPerDayEur: Float @method
}

"A single question within a wizard step."
type WizardQuestion {
    id: ID!
    key: String!
    label: String! @translate
    "The global wizard_step this question normally belongs to — used by campaign mode (see WizardCampaign.questions) to group its curated question subset onto the same pages the generic flow already uses, instead of one page per question."
    step: WizardStep @belongsTo
    "taxonomy_choice | taxonomy_multi_choice | number | number_array | date_range | boolean | text"
    inputType: String! @rename(attribute: "input_type")
    "The TaxonomyNode.type this question pulls choices from, when inputType is taxonomy_choice/taxonomy_multi_choice."
    taxonomyType: String @rename(attribute: "taxonomy_type")
    "Dot-path onto SearchSession (or free_text_answers) that this question's answer maps to."
    sessionField: String @rename(attribute: "session_field")
    allowFreeText: Boolean! @rename(attribute: "allow_free_text")
    "Blocks Proceed on this question's step until it's answered. Extensible flag, not hardcoded per-key — see the migration's docblock."
    mandatory: Boolean! @rename(attribute: "mandatory")
    "Only show this question if this node is in the session's selected-nodes set. Null means always show. Drives sub-questions (e.g. 'jeftino' -> budget question) without a code deploy."
    dependsOn: TaxonomyNode @belongsTo(relation: "dependsOn")
    sortOrder: Int! @rename(attribute: "sort_order")
    "Resolved taxonomy choices for this question. Pass parentId to scope (e.g. cities under a chosen country)."
    options(parentId: ID): [TaxonomyNode!]
        @field(resolver: "App\\GraphQL\\Resolvers\\WizardQuestionResolver@options")
}

"State of one in-progress or completed wizard run. No user required until the login-gated final step."
type SearchSession {
    id: ID!
    tripType: TaxonomyNode @belongsTo(relation: "tripType")
    adultsCount: Int @rename(attribute: "adults_count")
    childrenAges: [Int!] @rename(attribute: "children_ages")
    needsCrib: [Boolean!] @rename(attribute: "needs_crib")
    numberOfRooms: Int @rename(attribute: "number_of_rooms")
    "Total trip spending budget in EUR — separate from budgetTier (accommodation price/night only). Feeds BudgetEstimationEngine."
    totalBudget: Float @rename(attribute: "total_budget")
    groupType: TaxonomyNode @belongsTo(relation: "groupType")
    persona: TaxonomyNode @belongsTo(relation: "persona")
    budgetTier: TaxonomyNode @belongsTo(relation: "budgetTier")
    tipSmestaja: TaxonomyNode @belongsTo(relation: "tipSmestaja")
    terminCategory: String @rename(attribute: "termin_category")
    dateFrom: Date @rename(attribute: "date_from")
    dateTo: Date @rename(attribute: "date_to")
    countryRegion: TaxonomyNode @belongsTo(relation: "countryRegion")
    city: TaxonomyNode @belongsTo(relation: "city")
    "Where the user is traveling from — own step/question, same `city` taxonomy_type as the destination `city` field. See distanceFromHomeKm."
    homeCity: TaxonomyNode @belongsTo(relation: "homeCity")
    "Great-circle distance between homeCity and city, in km. Null until both are picked or if either is missing lat/lng meta."
    distanceFromHomeKm: Float @method
    freeTextAnswers: JSON @rename(attribute: "free_text_answers")
    status: String!
    "Every taxonomy node currently selected on this session (trip type, persona, preference tags, ...) — mirrors SearchSession::selectedTaxonomyNodeIds(). Frontend uses this to evaluate WizardQuestion.dependsOn without duplicating the resolution logic in TypeScript."
    selectedTaxonomyNodeIds: [ID!]! @method
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime! @rename(attribute: "updated_at")
}

"AI-generated pros/cons breakdown for one listing, matched against one session's stated preferences. See generateHonestReport."
type HonestReport {
    pros: [String!]!
    cons: [String!]!
    summary: String!
}

"A GeoNames world city (population > 15000) — see homeCitySearch."
type WorldCity {
    id: ID!
    name: String!
    countryCode: String! @rename(attribute: "country_code")
    lat: Float!
    lng: Float!
    population: Int
}

input UpdateSearchSessionInput {
    tripTypeId: ID
    adultsCount: Int
    childrenAges: [Int!]
    needsCrib: [Boolean!]
    numberOfRooms: Int
    totalBudget: Float
    groupTypeId: ID
    personaId: ID
    budgetTierId: ID
    tipSmestajaId: ID
    terminCategory: String
    dateFrom: Date
    dateTo: Date
    countryRegionId: ID
    cityId: ID
    homeCityId: ID
    freeTextAnswers: JSON
    status: String
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "Google profile picture URL, if logged in via Google — see GoogleAuthController."
    avatarUrl: String @rename(attribute: "avatar_url")

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!

    "AI-credit balance and welcome-bonus/booking-bonus history — see CLAUDE.md section 5."
    wallet: Wallet @hasOne
}

"See CLAUDE.md section 5, 'Credit / Wallet sistem'. balance is a credit count, not currency."
type Wallet {
    id: ID!
    balance: Int!
}
